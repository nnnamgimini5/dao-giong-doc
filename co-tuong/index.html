async function tok(t){try{var a=String(t).split('.');var pk=await S.importKey('jwk',C.pub,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);if(!(await S.verify({name:'ECDSA',hash:'SHA-256'},pk,ub(a[1]),ub(a[0]))))return null;var j=JSON.parse(D.decode(ub(a[0])));return j.v==='inv'?j:null}catch(e){return null}}
async function start(){var h=location.hash||'',m=h.match(/^#moi=([\w\-.]+)$/),t=m?m[1]:'';
 if(!t){try{t=sessionStorage.getItem('xq_tok')||''}catch(e){}}
 if(t){var j=await tok(t);if(!j){err('Link mời không hợp lệ. Nhờ chủ app gửi link mới.');try{sessionStorage.removeItem('xq_tok')}catch(e){}}
  else if(!(j.e>Date.now())){err('Link mời đã hết hạn. Nhờ chủ app gửi link mới.');try{sessionStorage.removeItem('xq_tok')}catch(e){}}
  else if(!j.k){err('Link mời thiếu khóa. Nhờ chủ app tạo lại link.')}
  else{try{sessionStorage.setItem('xq_tok',t)}catch(e){}try{await boot(j.k);return}catch(e){err('Link mời được tạo cho bản game cũ. Nhờ chủ app gửi link mới.');try{sessionStorage.removeItem('xq_tok')}catch(x){}}}}
 var k='';try{k=JSON.parse(localStorage.getItem('xq_k')||'""')}catch(e){}
 if(k){try{await boot(k);return}catch(e){try{localStorage.removeItem('xq_k')}catch(x){}}}
 if(t)$('own').open=false}
$('go').onclick=async function(){err('Đang kiểm tra…');try{var base=await S.importKey('raw',T.encode($('pw').value),'PBKDF2',false,['deriveKey']);
 var dk=await S.deriveKey({name:'PBKDF2',salt:ub(C.ke.salt),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 var jwk=JSON.parse(D.decode(await S.decrypt({name:'AES-GCM',iv:ub(C.ke.iv)},dk,ub(C.ke.ct))));
 var K=new Uint8Array(await S.decrypt({name:'AES-GCM',iv:ub(C.kw.iv)},dk,ub(C.kw.ct)));var kb=btoa(String.fromCharCode.apply(null,K)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
 try{localStorage.setItem('xq_own',JSON.stringify(jwk));localStorage.setItem('xq_k',JSON.stringify(kb))}catch(e){}
 await boot(kb)}catch(e){err('Mật khẩu không đúng.')}};
$('pw').onkeydown=function(e){if(e.key==='Enter')$('go').onclick()};
start()})();</script></body></html>
